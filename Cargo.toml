[package]
name = "herdr-kontrol"
version = "0.2.0"
edition = "2021"
description = "Maschine MK3 control surface for herdr and Rex"
license = "MIT"
repository = "https://github.com/pnomolos/herdr-kontrol"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
embedded-graphics = "0.8"
hidapi = "2"
nusb = "0.2"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

[profile.release]
lto = true
codegen-units = 1
