[package]
name = "herdr-kontrol"
version = "0.0.2"
edition = "2021"
description = "Maschine MK3 control surface for herdr"
license = "MIT"
repository = "https://github.com/pnomolos/herdr-kontrol"
publish = false

[dependencies]
anyhow = "1"
async-io = "2"
clap = { version = "4", features = ["derive", "env"] }
futures-lite = "2"
embedded-graphics = "0.8"
hidapi = "2"
nusb = "0.1.13"
pollster = "0.4"
profont = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
